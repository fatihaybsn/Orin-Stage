schema_version: 1
id: nvidia.jetpack-6.0-dp.jetson-linux-36.2
aliases:
  - jetson-orin@jp6.0-dp

support:
  status: unavailable

release:
  jetpack:
    version: "6.0 DP"
    availability: developer-preview
    lifecycle: pre-production
    officially_published: true
  jetson_linux:
    display_version: "36.2"
    release_revision: "36.2"
    artifact_revision: "36.2.0"
    release_tag: jetson_36.2
  l4t:
    version: "36.2"
